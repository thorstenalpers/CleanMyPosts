version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      svelte:
        patterns: ['svelte*', '@sveltejs/*']
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ['tauri*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
