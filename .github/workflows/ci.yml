name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # Windows, because that is the only platform this app targets; a Linux
    # runner would pass on code that cannot build for release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test:coverage

      - name: E2E (Playwright)
        run: |
          npx playwright install chromium
          npm run test:e2e

      - name: Build
        run: npm run build

      - name: Upload Test Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: coverage

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The Rust host embeds dist/content/content.js with include_str!, so the frontend
      # has to be built before cargo can even parse the crate.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test
