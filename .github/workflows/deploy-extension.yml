name: 'Deploy Extension'

on:
  workflow_dispatch: # manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MANIFEST_PATH: 'extension/manifest.json'

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Typecheck
        run: npm run check

      - name: Extract version
        shell: bash
        run: |
          version=$(node -p "require('./${MANIFEST_PATH}').version")
          if [ -z "$version" ]; then
            echo "No version in ${MANIFEST_PATH}" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build:extension

      # Stores take a zip of the extension root, not of a folder containing it.
      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          for browser in chrome firefox; do
            (cd "dist/extension/$browser" && zip -qr "../../../artifacts/cleanmyposts-$browser-$VERSION.zip" .)
          done
          ls -la artifacts

      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "ext-v${{ env.VERSION }}" -m "Extension v${{ env.VERSION }}"
          git push origin "ext-v${{ env.VERSION }}"

      # `make_latest: false` is load-bearing, not tidiness. The desktop updater polls
      # `releases/latest/download/latest.json`, and an extension release taking that spot
      # leaves every installed app unable to find an update.
      - name: Create GitHub release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: 'ext-v${{ env.VERSION }}'
          name: 'CleanMyPosts Extension ${{ env.VERSION }}'
          body_path: ./release-notes/ext-v${{ env.VERSION }}.md
          make_latest: 'false'
          files: artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Independent of the Firefox step: one store rejecting a version must not stop the other.
      - name: Publish to Chrome Web Store
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: npx --yes chrome-webstore-upload-cli@3 upload --source "artifacts/cleanmyposts-chrome-$VERSION.zip" --auto-publish
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      # AMO requires the source of a minified build; extension/SOURCE.md is the reviewer's guide to it.
      # `--approval-timeout 0` submits and returns instead of waiting hours for the review.
      - name: Publish to Firefox Add-ons
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        run: |
          git archive --format=zip -o artifacts/source.zip "ext-v$VERSION"
          npx --yes web-ext@9 sign \
            --channel listed \
            --source-dir dist/extension/firefox \
            --artifacts-dir artifacts/amo \
            --ignore-files '**/*.map' \
            --upload-source-code artifacts/source.zip \
            --approval-timeout 0 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
