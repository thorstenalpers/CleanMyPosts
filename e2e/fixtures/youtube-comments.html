<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube comments fixture</title>
  </head>
  <body>
    <div id="contents">
      <div role="listitem">
        <span>Comment 1</span>
        <div jscontroller="Fs3gzb">
          <button aria-label="Delete activity item">Delete</button>
        </div>
      </div>
      <div role="listitem">
        <span>Comment 2</span>
        <div jscontroller="Fs3gzb">
          <button aria-label="Delete activity item">Delete</button>
        </div>
      </div>
    </div>

    <div role="dialog">
      <div role="button" data-id="EBS5u"><span class="Crf1o">Delete</span></div>
    </div>

    <script>
      // Stand in for YouTube's shared confirmation dialog: clicking a comment's
      // delete button arms it, confirming removes that comment's listitem.
      let pending = null;
      document.addEventListener('click', (e) => {
        const del = e.target.closest?.('div[jscontroller="Fs3gzb"] button');
        if (del) {
          pending = del.closest('div[role="listitem"]');
          return;
        }
        const confirm = e.target.closest?.('div[role="button"]');
        if (confirm && pending) {
          pending.remove();
          pending = null;
        }
      });
    </script>
  </body>
</html>
