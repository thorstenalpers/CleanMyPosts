<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube liked-videos fixture</title>
  </head>
  <body>
    <!--
      My Activity, not the Liked videos playlist: both YouTube lists are deleted here, with the
      button beside each row rather than through a menu.

      Deliberately without `jscontroller` or any other generated attribute. The selectors stopped
      relying on those because their values rotate with a Google deployment, and a fixture that
      still carried them would let a selector pinned to one keep passing.
    -->
    <div id="contents">
      <div role="listitem">
        <span>Liked video 1</span>
        <button aria-label="Delete activity item">Delete</button>
      </div>
      <div role="listitem">
        <span>Liked video 2</span>
        <button aria-label="Delete activity item">Delete</button>
      </div>
    </div>

    <script>
      // No confirmation sheet on this list, which is the case worth covering here: the row goes
      // on the click, and an engine that waits for a sheet anyway spends four seconds per item.
      document.addEventListener('click', (e) => {
        const del = e.target.closest?.('button[aria-label]');
        if (del) del.closest('div[role="listitem"]')?.remove();
      });
    </script>
  </body>
</html>
