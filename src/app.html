<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CleanMyPosts</title>
    <style>
      /* Bridges the gap between "page painted" and "Svelte mounted"; replaced on mount. */
      #app:empty {
        display: flex;
        height: 100vh;
        padding-top: 40px;
        background: canvas;
      }
      #app:empty::before,
      #app:empty::after {
        content: '';
        margin: 16px;
        border-radius: 12px;
        background: color-mix(in srgb, canvastext 8%, transparent);
      }
      #app:empty::before {
        width: 208px;
      }
      #app:empty::after {
        flex: 1;
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    <div id="app">%sveltekit.body%</div>
  </body>
</html>
